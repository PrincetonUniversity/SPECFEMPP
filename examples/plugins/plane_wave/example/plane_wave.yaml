# Plane-wave plugin configuration, passed with --injection-config.
# The material must match the one in DATA/meshfem3D_files/Mesh_Par_file.
material: {rho: 2300, vp: 2800, vs: 1500}
wave:
  type: P              # P | SV
  take-off: 20         # degrees from +z (0 travels straight up)
  azimuth: 30          # degrees from +x toward +y
  origin: [6000, 6000, -4200]   # the wavefront crosses this point (the box centre) ...
  origin-time: 4.0     # ... at this time
  amplitude: 1.0e-3    # displacement amplitude
source-time-function: {type: ricker, f0: 0.5}   # or {type: gaussian, half-duration: 2.0}
material-tolerance: 1.0e-4                        # relative

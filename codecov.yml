# Codecov configuration for SPECFEM++.
# Coverage reflects the C++ library under core/specfem/; everything else is ignored.

coverage:
  status:
    project:
      default:
        # Report only; do not block merges until a baseline is established.
        informational: true
    patch:
      # Gate PRs on the coverage of the lines they add/change. Only lines under
      # core/ count (see paths + the ignore list below); everything else is
      # irrelevant to pass/fail.
      default:
        target: 80%           # fail if <80% of changed lines are covered
        threshold: 5%         # some slack below target
        informational: false  # block the PR (was: informational: true)
        paths:
          - "core/"           # only changed lines under core/ drive the status
        if_not_found: success  # PRs touching no measurable core lines pass
        if_ci_failed: error

ignore:
  - "_deps/**/*"
  - "tests/**/*"
  - "src/**/*"
  - "fortran/**/*"
  - "benchmarks/**/*"

id : "HomogeneousHalfspaceSmallNoABCForceSource"
name : "Homogeneous elastic isotropic half space (MPI, 4 ranks)"
description: >
  Testing newmark time-marching solver on a homogeneous elastic domain with no
  interfaces. Test is run on 4 MPI processes (2x2 partition) and the gathered
  seismograms are compared against the single-process Fortran reference traces.
config:
  nproc : 4
  tolerance : 1e-3
databases:
  specfem_config: "specfem_config.yaml"
  traces: "traces"

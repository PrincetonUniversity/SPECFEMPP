parameters:

  header:
    title: Homogeneous acoustic free-surface force source
    description: |
      Material systems : Acoustic domain (1)
      Interfaces : None
      Sources : Force source (1) on acoustic free surface
      Boundary conditions : Acoustic free surface

  simulation-setup:
    quadrature:
      quadrature-type: GLL4

    solver:
      time-marching:
        type-of-simulation: forward
        time-scheme:
          type: Newmark
          dt: 1.1e-3
          nstep: 75

    simulation-mode:
      forward:
        writer:
          seismogram:
            output-format: ascii
            output-folder: "."

  receivers:
    stations: "displacement_tests/Newmark/serial/dim2/HomogeneousAcousticFreeSurfaceForceSource/STATIONS"
    angle: 0.0
    seismogram-type:
      - pressure
    nstep_between_samples: 1

  run-setup:
    number-of-processors: 1
    number-of-runs: 1

  databases:
    mesh-database: "displacement_tests/Newmark/serial/dim2/HomogeneousAcousticFreeSurfaceForceSource/database.bin"

  sources: "displacement_tests/Newmark/serial/dim2/HomogeneousAcousticFreeSurfaceForceSource/sources.yaml"

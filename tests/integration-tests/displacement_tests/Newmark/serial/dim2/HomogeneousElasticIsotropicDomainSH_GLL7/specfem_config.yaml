parameters:

  header:
    ## Header information is used for logging. It is good practice to give your simulations explicit names
    title: Isotropic Elastic simulation (SH-Waves) # name for your simulation
    # A detailed description for your simulation
    description: |
      Material systems : Elastic domain (1)
      Interfaces : None
      Sources : Force source (1)
      Boundary conditions : Neumann BCs on all edges
      Debugging comment : This test tests elastic compute_forces routine

  simulation-setup:
    elastic-wave: "SH"
    ## quadrature setup
    quadrature:
      quadrature-type: GLL7

    ## Solver setup
    solver:
      time-marching:
        type-of-simulation: forward
        time-scheme:
          type: Newmark
          dt: 3.6666666666666667e-4
          nstep: 900

    simulation-mode:
      forward:
        writer:
          seismogram:
            format: ascii
            directory: "."

  receivers:
    stations: "displacement_tests/Newmark/serial/dim2/HomogeneousElasticIsotropicDomainSH_GLL7/STATIONS"
    angle: 0.0
    seismogram-type:
      - displacement
      - velocity
      - acceleration
    nstep_between_samples: 3

  ## Runtime setup
  run-setup:
    number-of-processors: 1
    number-of-runs: 1

  ## databases
  databases:
    mesh-database: "displacement_tests/Newmark/serial/dim2/HomogeneousElasticIsotropicDomainSH/database.bin"

  sources: "displacement_tests/Newmark/serial/dim2/HomogeneousElasticIsotropicDomainSH/sources.yaml"

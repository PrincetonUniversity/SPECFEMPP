id : "HomogeneousHalfspaceSmallNoABCForceSourceAttenuation"
name : "Homogeneous elastic isotropic half space with attenuation and no interfaces"
description: >
  Testing newmark time-marching solver on a homogeneous elastic domain with attenuation and no interfaces. Test is run on a single MPI process.
  Reference traces come from SPECFEM3D (1/L attenuation formulation), while
  SPECFEM++ uses the SPECFEM3D_GLOBE formulation for all 3D meshes. The
  formulations differ in the Q fit and modulus scaling, giving a measured
  relative L2 error of up to 7.4e-3 (5.9e-6 with the 1/L formulation), so the
  tolerance is 1e-2 instead of 1e-3. See README.md.
config:
  nproc : 1
  tolerance : 1e-2
databases:
  specfem_config: "specfem_config.yaml"
  traces: "traces"

parameters:

  header:
    ## Header information is used for logging. It is good practice to give your simulations explicit names
    title: Isotropic elastic simulation with attenuation # name for your simulation
    # A detailed description for your simulation
    description: |
      Material systems : Elastic domain with attenuation(1)
      Interfaces : None
      Sources : Force source (1)
      Boundary conditions : Neumann BCs on all edges
      Debugging comment : This test tests elastic compute_forces routine with attenuation

  simulation-setup:
    ## quadrature setup
    quadrature:
      quadrature-type: GLL4

    ## Solver setup
    solver:
      time-marching:
        type-of-simulation: forward
        time-scheme:
          type: Newmark
          dt: 1.1e-3
          nstep: 1000

    simulation-mode:
      forward:
        writer:
          seismogram:
            format: ascii
            directory: "./"

  receivers:
    stations: "displacement_tests/Newmark/serial/dim2/HomogeneousElasticDomainAttenuation/STATIONS"
    angle: 0.0
    seismogram-type:
      - displacement
      - velocity
      - acceleration
      - pressure
    nstep_between_samples: 1

  ## Runtime setup
  run-setup:
    number-of-processors: 1
    number-of-runs: 1

  ## databases
  databases:
    mesh-database: "displacement_tests/Newmark/serial/dim2/HomogeneousElasticDomainAttenuation/database.bin"

  sources: "displacement_tests/Newmark/serial/dim2/HomogeneousElasticDomainAttenuation/sources.yaml"

  ## attenuation setup
  attenuation:
    enabled: true
    reference-frequency: 5.0 Hz
    attenuation-frequency-band: # Frequencies band is hard-coded to f0/10 and f0*10 in specfem2d fortran.
      - 0.5 Hz
      - 50.0 Hz

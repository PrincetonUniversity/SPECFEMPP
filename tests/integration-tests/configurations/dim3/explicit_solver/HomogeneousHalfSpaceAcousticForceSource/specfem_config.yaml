parameters:

  header:
    ## Header information is used for logging. It is good practice to give your simulations explicit names
    title: Isotropic Acoustic simulation # name for your simulation
    # A detailed description for your simulation
    description: |
      Material systems : Acoustic domain (1)
      Interfaces : None
      Sources : Force source (1)
      Boundary conditions : Dirichlet BCs on all edges
      Debugging comment : This test tests acoustic compute_forces routine

  simulation-setup:
    ## quadrature setup
    quadrature:
      quadrature-type: GLL4

    ## Solver setup
    solver:
      time-marching:
        type-of-simulation: forward
        time-scheme:
          type: Newmark
          dt: 0.00095
          nstep: 75

    simulation-mode:
      forward:
        writer:
          seismogram:
            format: ascii
            directory: "./"

  receivers:
    stations: "displacement_tests/Newmark/serial/dim3/HomogeneousHalfSpaceAcousticForceSource/STATIONS"
    angle: 0.0
    seismogram-type:
      - pressure
    nstep_between_samples: 1

  ## Runtime setup
  run-setup:
    number-of-processors: 1
    number-of-runs: 1

  ## databases
  databases:
    mesh-database: "displacement_tests/Newmark/serial/dim3/HomogeneousHalfSpaceAcousticForceSource/database.bin"

  sources: "displacement_tests/Newmark/serial/dim3/HomogeneousHalfSpaceAcousticForceSource/force.yaml"

parameters:

  header:
    ## Header information is used for logging. It is good practice to give your simulations explicit names
    title: Isotropic Elastic simulation (MPI) # name for your simulation
    # A detailed description for your simulation
    description: |
      Material systems : Elastic domain (1)
      Interfaces : None
      Sources : Force source (1)
      Boundary conditions : Neumann BCs on all edges
      Debugging comment : This test tests elastic compute_forces routine under MPI

  simulation-setup:
    ## quadrature setup
    quadrature:
      quadrature-type: GLL4

    ## Solver setup
    solver:
      time-marching:
        type-of-simulation: forward
        time-scheme:
          type: Newmark
          dt: 0.025
          nstep: 105

    simulation-mode:
      forward:
        writer:
          seismogram:
            format: ascii
            directory: "./"

  receivers:
    stations: "configurations/dim3/explicit_solver/MPIHomogeneousHalfspaceSmallNoABCForceSource/STATIONS"
    angle: 0.0
    seismogram-type:
      - displacement
      - velocity
      - acceleration
    nstep_between_samples: 1

  ## Runtime setup
  run-setup:
    number-of-processors: 4
    number-of-runs: 1

  ## databases
  databases:
    mesh-database: "configurations/dim3/explicit_solver/MPIHomogeneousHalfspaceSmallNoABCForceSource/database.bin"

  sources: "configurations/dim3/explicit_solver/MPIHomogeneousHalfspaceSmallNoABCForceSource/force.yaml"

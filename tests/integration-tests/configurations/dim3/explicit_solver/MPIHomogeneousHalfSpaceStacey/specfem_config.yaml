parameters:

  header:
    title: Isotropic Elastic simulation with Stacey ABC (MPI)
    description: |
      Material systems : Elastic domain (1)
      Interfaces : None
      Sources : Force source (1)
      Boundary conditions : Stacey ABCs on five faces, free surface on top
      Debugging comment : Tests Stacey absorbing boundary condition under MPI

  simulation-setup:
    quadrature:
      quadrature-type: GLL4

    solver:
      time-marching:
        type-of-simulation: forward
        time-scheme:
          type: Newmark
          dt: 0.035
          nstep: 150

    simulation-mode:
      forward:
        writer:
          seismogram:
            format: ascii
            directory: "./"

  receivers:
    stations: "configurations/dim3/explicit_solver/MPIHomogeneousHalfSpaceStacey/STATIONS"
    angle: 0.0
    seismogram-type:
      - displacement
      - velocity
      - acceleration
    nstep_between_samples: 1

  run-setup:
    number-of-processors: 4
    number-of-runs: 1

  databases:
    mesh-database: "configurations/dim3/explicit_solver/MPIHomogeneousHalfSpaceStacey/database.bin"

  sources: "configurations/dim3/explicit_solver/MPIHomogeneousHalfSpaceStacey/force.yaml"

# Plane-wave plugin configuration: P wave crossing the box centre at t = 4 s.
material: {rho: 2300, vp: 2800, vs: 1500}
wave:
  type: P
  take-off: 30
  azimuth: 40
  origin: [5000, 5000, -5000]
  origin-time: 4.0
  amplitude: 1.0e-3
source-time-function: {type: ricker, f0: 0.4}
material-tolerance: 1.0e-4

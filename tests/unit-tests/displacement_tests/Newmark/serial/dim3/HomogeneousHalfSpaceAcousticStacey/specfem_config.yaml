parameters:

  header:
    title: Isotropic Acoustic simulation with Stacey ABC
    description: |
      Material systems : Acoustic domain (1)
      Interfaces : None
      Sources : Force source (1)
      Boundary conditions : Stacey ABCs on five faces, acoustic free surface on top
      Debugging comment : Tests Stacey absorbing boundary condition implementation for acoustic media

  simulation-setup:
    quadrature:
      quadrature-type: GLL4

    solver:
      time-marching:
        type-of-simulation: forward
        time-scheme:
          type: Newmark
          dt: 0.02
          nstep: 150

    simulation-mode:
      forward:
        writer:
          seismogram:
            format: ascii
            directory: "./"

  receivers:
    stations: "displacement_tests/Newmark/serial/dim3/HomogeneousHalfSpaceAcousticStacey/STATIONS"
    angle: 0.0
    seismogram-type:
      - pressure
    nstep_between_samples: 1

  run-setup:
    number-of-processors: 1
    number-of-runs: 1

  databases:
    mesh-database: "displacement_tests/Newmark/serial/dim3/HomogeneousHalfSpaceAcousticStacey/database.bin"

  sources: "displacement_tests/Newmark/serial/dim3/HomogeneousHalfSpaceAcousticStacey/force.yaml"

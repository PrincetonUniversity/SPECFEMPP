name: Unittests

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - '*' # All branches should run on PRs


jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check GNU and Cmake versions
        run: gcc --version && cmake --version
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release -j 2
      - name: Run all tests
        run: cd build/release/tests/
          && ctest --verbose
  # Threaded backend. Kokkos bit-copies point types into per-thread reduction
  # scratch, which Serial never exercises -- see issue #2008.
  build-and-test-openmp:
    runs-on: ubuntu-latest
    steps:
      - name: Check GNU and Cmake versions
        run: gcc --version && cmake --version
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset release-openmp
      - name: Build
        run: cmake --build --preset release-openmp -j 2
      # Covers integration-tests too: the Newmark moment-tensor cases in #2008
      # only crashed there.
      - name: Run all tests
        run: cd build/release-openmp/tests
          && ctest --verbose
        env:
          OMP_NUM_THREADS: 2
          OMP_PROC_BIND: spread
  # This job is for building and testing with IO dependencies like HDF5 and ADIOS2
  build-and-test-with-io-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Check GNU and Cmake versions
        run: gcc --version && cmake --version
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset release-io
      - name: Build
        run: cmake --build --preset release-io -j 2
      - name: Run all tests
        run: cd build/release-io/tests/
          && ctest --verbose
  # The FK injection plugin is a standalone project: build it against the
  # installed plugin SDK only. Installing the header-only SDK needs a
  # configured core tree, not a built one.
  build-and-test-fk-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Check GNU and Cmake versions
        run: gcc --version && cmake --version
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure core
        run: cmake -S . -B build/core-sdk -DCMAKE_BUILD_TYPE=Release
          -DSPECFEM_BUILD_TESTS=OFF -DSPECFEM_BUILD_BENCHMARKS=OFF
      - name: Install plugin SDK
        run: cmake --install build/core-sdk --component plugin_sdk
          --prefix "$RUNNER_TEMP/plugin-sdk"
      - name: Configure plugin
        run: cmake -S plugin/fk-injection -B build/fk-plugin
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/plugin-sdk"
      # Building runs the SDK's exported-symbol check.
      - name: Build plugin
        run: cmake --build build/fk-plugin -j 2
      - name: Run plugin tests
        run: ctest --test-dir build/fk-plugin --output-on-failure
